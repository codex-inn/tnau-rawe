<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full Daily Activity Report | TNAU RAWE PAIYUR</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#17301f;background:#eef5ef}
header{background:linear-gradient(135deg,#064b25,#0b7a35);color:#fff;text-align:center;padding:24px 15px}
header h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}header p{margin:4px;color:#dcefd7}
.page{width:94%;max-width:1000px;margin:25px auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;padding:11px 16px;text-decoration:none;font-weight:800;cursor:pointer;background:#075128;color:#fff}
.btn.light{background:#e8f5eb;color:#075128}.btn.pdf{background:#b3261e}.btn:disabled{opacity:.55;cursor:not-allowed}
.sheet{background:#fff;border-radius:16px;padding:25px;box-shadow:0 5px 22px #0002}
.title{text-align:center;border-bottom:2px solid #d7e8da;padding-bottom:18px;margin-bottom:20px}.title h2{margin:0;color:#075128}.title p{margin:6px 0;color:#667269}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}.box{background:#f7fbf7;border:1px solid #dce9de;border-radius:11px;padding:15px}.box h3{margin:0 0 9px;color:#075128;font-size:17px}.box p{margin:6px 0;line-height:1.6;white-space:pre-wrap}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.photos img{width:100%;height:230px;object-fit:cover;border-radius:11px;cursor:pointer;border:1px solid #d4e2d6}
.signature{display:block;width:180px;height:70px;max-width:180px;max-height:70px;object-fit:contain;object-position:left center;border-bottom:1px solid #777;padding-bottom:8px;margin-top:6px}
.pdfbox iframe{width:100%;height:650px;border:1px solid #d4e2d6;border-radius:10px;background:#eee}
.loading,.error{text-align:center;padding:30px;background:#fff;border-radius:14px}.error{color:#a5221d}
footer{text-align:center;color:#607065;padding:25px}
@media print{
body{background:#fff}.toolbar,header,footer{display:none!important}.page{width:100%;max-width:none;margin:0}.sheet{box-shadow:none;border-radius:0;padding:0}.box{break-inside:avoid;box-shadow:none}.photos img{height:auto;max-height:260px}.pdfbox{display:none!important}.signature{width:180px;height:70px;max-width:180px;max-height:70px}
}
@media(max-width:650px){.info{grid-template-columns:1fr}.sheet{padding:16px}.photos{grid-template-columns:1fr 1fr}.photos img{height:145px}.pdfbox iframe{height:500px}.btn{flex:1}.toolbar{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>🌾 Full Daily Activity Report</h1><p>TNAU RAWE Programme 2026 · Team Paiyur</p></header>
<main class="page">
<div class="toolbar">
<a class="btn light" href="activities.html">← Back to Daily Activities</a>
<button id="pdfView" class="btn pdf" style="display:none" onclick="openPdf()">📄 View PDF</button>
<button id="pdfDownload" class="btn pdf" style="display:none" onclick="downloadPdf()">⬇️ Download PDF</button>
<button class="btn light" onclick="printReport()">🖨️ Print Report</button>
</div>
<div id="content"><div class="loading">Loading full report...</div></div>
</main>
<footer>AC&amp;RI VVNR · Tiruvannamalai District · Team Paiyur</footer>
<script>
const SUPABASE_URL='https://xsibfnyngjmdvspbtnfm.supabase.co';
const SUPABASE_KEY='sb_publishable__zqWhUWuKQdZQMocfgfB3A_RqDVc95g';
const HEADERS={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY};
const id=new URLSearchParams(location.search).get('id');
let currentPdf='';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openPhoto(src){window.open(src,'_blank','noopener,noreferrer')}
function openPdf(){if(currentPdf)window.open(currentPdf,'_blank','noopener,noreferrer')}
function printReport(){window.print()}
async function downloadPdf(){
 if(!currentPdf)return;
 const b=document.getElementById('pdfDownload');b.disabled=true;b.textContent='⏳ Downloading...';
 try{
  const r=await fetch(currentPdf);if(!r.ok)throw new Error('PDF could not be downloaded');
  const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='TNAU-RAWE-Daily-Activity-Report.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(e){window.open(currentPdf,'_blank','noopener,noreferrer');alert('Direct download was blocked by the browser, so the PDF was opened instead.')}
 finally{b.disabled=false;b.textContent='⬇️ Download PDF'}
}
async function load(){
 if(!id){document.getElementById('content').innerHTML='<div class="error">Report ID is missing.</div>';return}
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/rawe_activities?id=eq.'+encodeURIComponent(id)+'&select=*',{headers:HEADERS});
  if(!r.ok)throw new Error(await r.text());const rows=await r.json();if(!rows.length)throw new Error('Report not found');
  const x=rows[0];currentPdf=x.pdf_url||'';
  if(currentPdf){document.getElementById('pdfView').style.display='inline-flex';document.getElementById('pdfDownload').style.display='inline-flex'}
  const photos=Array.isArray(x.image_urls)?x.image_urls:[];
  const photoHtml=photos.length?photos.map(u=>'<img src="'+esc(u)+'" alt="Activity photo" onclick="openPhoto(this.src)">').join(''):'<p>No activity photos attached.</p>';
  const sign=x.tl_signature_url?'<img class="signature" src="'+esc(x.tl_signature_url)+'" alt="Team Leader Signature">':'<p>TL signature not attached.</p>';
  const pdfHtml=currentPdf?'<div class="pdfbox"><iframe src="'+esc(currentPdf)+'" title="PDF report"></iframe></div>':'<p>No PDF report attached.</p>';
  document.getElementById('content').innerHTML='<article class="sheet"><div class="title"><h2>🌾 Daily RAWE Activity Report</h2><p>Team Paiyur · TNAU RAWE Programme 2026</p></div><div class="info"><div class="box"><h3>📅 Date</h3><p>'+esc(x.activity_date)+'</p></div><div class="box"><h3>🌾 Activity Type</h3><p>'+esc(x.activity_type||'Activity')+'</p></div><div class="box"><h3>📍 Location / Village</h3><p>'+esc(x.location||'—')+'</p></div><div class="box"><h3>🌱 Crop / Farm</h3><p>'+esc(x.crop||'—')+'</p></div></div><div class="box"><h3>📝 Activity Description</h3><p>'+esc(x.description||'—')+'</p></div><div class="box"><h3>🎓 Learning / Outcome</h3><p>'+esc(x.learning||'—')+'</p></div><div class="box"><h3>📸 Activity Photos</h3><div class="photos">'+photoHtml+'</div></div><div class="box"><h3>📄 PDF Report</h3>'+pdfHtml+'</div><div class="box"><h3>✍️ Team Leader Approval</h3>'+sign+'<p><strong>Team Leader · Team Paiyur</strong></p></div></article>';
 }catch(e){document.getElementById('content').innerHTML='<div class="error">Could not load this report.<br><br>'+esc(e.message)+'</div>'}
}
load();
</script>
</body>
</html>
