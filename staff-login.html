<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Staff Login | TNAU RAWE</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:15px;

    font-family:
    "Segoe UI",
    Arial,
    Helvetica,
    sans-serif;

    background:

    linear-gradient(
        rgba(255,255,255,.48),
        rgba(255,255,255,.48)
    ),

    url("vvnr-campus.jpg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-box{

    width:100%;

    max-width:400px;

    background:
    rgba(255,255,255,.97);

    padding:30px;

    border-radius:12px;

    border-top:
    5px solid #8b0000;

    box-shadow:
    0 15px 40px
    rgba(0,0,0,.20);

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:72px;

    height:72px;

    display:block;

    object-fit:contain;

    margin:
    0 auto 12px;

}


/* =====================================================
   TITLE
===================================================== */

h1{

    text-align:center;

    color:#8b0000;

    font-size:24px;

    font-weight:800;

}


.subtitle{

    text-align:center;

    color:#6b756e;

    font-size:12px;

    margin-top:5px;

    margin-bottom:23px;

}


/* =====================================================
   LABEL
===================================================== */

label{

    display:block;

    color:#4a2828;

    font-size:13px;

    font-weight:700;

    margin:
    13px 0 6px;

}


/* =====================================================
   INPUT
===================================================== */

input{

    width:100%;

    padding:12px;

    border:
    1px solid #dccfcf;

    border-radius:7px;

    font-size:14px;

    outline:none;

    background:#ffffff;

    color:#241818;

    transition:.2s;

}


input:focus{

    border-color:#8b0000;

    box-shadow:
    0 0 0 3px
    rgba(139,0,0,.10);

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-btn{

    width:100%;

    margin-top:20px;

    padding:12px;

    border:0;

    border-radius:7px;

    background:#8b0000;

    color:white;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


.login-btn:hover{

    background:#a50000;

    transform:
    translateY(-1px);

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

.error{

    display:none;

    margin-top:12px;

    padding:9px;

    background:#fff0f0;

    color:#8b0000;

    border-radius:6px;

    text-align:center;

    font-size:11px;

    border:
    1px solid #f0cccc;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    body{

        padding:12px;

        background:

        linear-gradient(
            rgba(255,255,255,.52),
            rgba(255,255,255,.52)
        ),

        url("vvnr-campus.jpg");

        background-size:cover;

        background-position:center;

    }


    .login-box{

        max-width:360px;

        padding:
        24px 18px;

        border-radius:11px;

    }


    .logo{

        width:62px;

        height:62px;

        margin-bottom:10px;

    }


    h1{

        font-size:21px;

    }


    .subtitle{

        font-size:11px;

        margin-bottom:20px;

    }


    label{

        font-size:12px;

    }


    input{

        padding:11px;

        font-size:13px;

    }


    .login-btn{

        padding:11px;

        font-size:13px;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:360px){

    .login-box{

        padding:
        21px 15px;

    }


    .logo{

        width:57px;

        height:57px;

    }


    h1{

        font-size:20px;

    }


    .subtitle{

        font-size:10px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     STAFF LOGIN
===================================================== -->

<div class="login-box">


    <!-- TNAU LOGO -->

    <img
        src="tnau-logo.png"
        alt="TNAU Logo"
        class="logo">


    <!-- TITLE -->

    <h1>
        Staff Login
    </h1>


    <div class="subtitle">

        TNAU RAWE Programme 2026 ·
        Team Paiyur

    </div>


    <!-- LOGIN FORM -->

    <form id="staffLogin">


        <!-- USERNAME -->

        <label for="username">

            Username

        </label>


        <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="username"
            required>


        <!-- PASSWORD -->

        <label for="password">

            Password

        </label>


        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn">

            Staff Login

        </button>


        <!-- ERROR -->

        <div
            id="error"
            class="error">

            Invalid username or password.

        </div>


    </form>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   STAFF LOGIN ACCOUNTS
===================================================== */

const staff = {

    "sankar":
    "paiyur2023",

    "senthilkumar":
    "paiyur2023"

};


/* =====================================================
   STAFF LOGIN
===================================================== */

document
.getElementById("staffLogin")
.addEventListener(
"submit",
function(e){

    e.preventDefault();


    /* GET USERNAME */

    const username =

        document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase();


    /* GET PASSWORD */

    const password =

        document
        .getElementById("password")
        .value
        .trim();


    /* =================================================
       CHECK LOGIN
    ================================================= */

    if(

        staff[username] &&
        staff[username] === password

    ){

        /* SAVE LOGIN STATUS */

        localStorage.setItem(
            "staffLoggedIn",
            "true"
        );


        /* SAVE STAFF USERNAME */

        localStorage.setItem(
            "staffName",
            username
        );


        /* OPEN DASHBOARD */

        window.location.href =
        "staff-dashboard.html";

    }

    else{

        /* SHOW ERROR */

        document
        .getElementById("error")
        .style.display =
        "block";

    }

});

</script>


</body>

</html>
